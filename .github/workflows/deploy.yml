name: Deploy LMS to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t pavangujari/lms:latest .

      - name: Push Docker Image
        run: docker push pavangujari/lms:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
             sudo docker pull pavangujari/lms:latest
             sudo docker stop lms-container || true
             sudo docker rm lms-container || true
             sudo docker run -d --name lms-container -p 80:5000 pavangujari/lms:latest