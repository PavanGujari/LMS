<!DOCTYPE html>
<html>
<head>
    <title>Courses</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h1>Courses</h1>

<table border="1" align="center">
    <tr>
        <th>ID</th>
        <th>Course Name</th>
    </tr>

    {% for c in courses %}
    <tr>
        <td>{{ c[0] }}</td>
        <td>{{ c[1] }}</td>
    </tr>
    {% endfor %}

</table>

<br>

<a href="/add-course">
    <button>Add New Course</button>
</a>

</body>
</html>
